services:
  stone-server:
    image: ghcr.io/snoowood/stone_server:latest
    container_name: stone-server
    env_file:
      - path: runtime.env
        required: true
    environment:
      # Fail-closed: 항상 production. environment 가 env_file(runtime.env) 보다 우선한다.
      # ⚠️ ${APP_ENV:-production} 로는 안 된다 — deploy-from-runner.sh 가
      #    `docker compose --env-file runtime.env up` 으로 띄우고 --env-file 은 변수 보간
      #    소스도 되므로, runtime.env 시크릿에 APP_ENV=development 가 있으면 default 를
      #    가로채 운영이 dev 로 떠 /auth/dev·/internal/dev-token·mock Steam 이 노출된다.
      APP_ENV: production
      SERVER_PORT: 8080
      DB_URL: postgres://${DB_USER:-stone}:${DB_PASSWORD:?DB_PASSWORD is required}@stone-postgres:5432/${DB_NAME:-stone_server}?sslmode=disable
      REDIS_URL: redis://stone-redis:6379
    depends_on:
      stone-postgres:
        condition: service_healthy
      stone-redis:
        condition: service_healthy
    networks:
      - stone-server-internal
      - snoowoo-public
    restart: unless-stopped

  stone-postgres:
    image: postgres:15-alpine
    container_name: stone-postgres
    env_file:
      - path: runtime.env
        required: true
    environment:
      POSTGRES_DB: ${DB_NAME:-stone_server}
      POSTGRES_USER: ${DB_USER:-stone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - /opt/snoowoo/stone-server/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stone} -d ${DB_NAME:-stone_server}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - stone-server-internal
    restart: unless-stopped

  stone-redis:
    image: redis:7-alpine
    container_name: stone-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - /opt/snoowoo/stone-server/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stone-server-internal
    restart: unless-stopped

networks:
  stone-server-internal:
    driver: bridge
  snoowoo-public:
    external: true
