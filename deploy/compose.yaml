services:
  stone-server:
    image: ${APP_IMAGE:-ghcr.io/snoowood/stone_server:latest}
    container_name: stone-server
    env_file:
      - path: runtime.env
        required: true
    environment:
      # APP_ENV 는 runtime.env 시크릿이 단일 소스. 미설정 시 development 기본(현 단계 main=dev).
      # 시크릿에 APP_ENV=production 을 넣으면 production. (production 의 strict fail-closed 는
      # Stage 2 에서 production 배포 경로에 별도 적용 예정.)
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: 8080
      DB_URL: postgres://${DB_USER:-stone}:${DB_PASSWORD:?DB_PASSWORD is required}@stone-postgres:5432/${DB_NAME:-stone_server}?sslmode=disable
      REDIS_URL: redis://stone-redis:6379
      # P0-3: prod 는 PG+Redis 경로(SQLITE_PATH 미설정 = PG 모드). runtime.env 시크릿에
      # SQLITE_PATH 가 새어 들어와도 빈 값으로 덮어써 SQLite 모드(Postgres 우회) 전락을
      # 차단한다(누출 방어, 현 동작 무변경).
      SQLITE_PATH: ""
    depends_on:
      stone-postgres:
        condition: service_healthy
      stone-redis:
        condition: service_healthy
    # SRE-6: 런타임 지속 헬스체크. /api/v1/health 는 db.Ping+kv.Ping 실패 시 503 → unhealthy 표시.
    # alpine busybox wget 사용(이미지 내장, deploy-from-runner.sh 의 배포후 프로브와 동일 경로).
    # compose 단독은 unhealthy 표시·depends_on 게이팅만 하고 자동재시작은 안 함(자동복구는 별도).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - stone-server-internal
      - snoowoo-public
    restart: unless-stopped

  stone-postgres:
    image: postgres:15-alpine
    container_name: stone-postgres
    env_file:
      - path: runtime.env
        required: true
    environment:
      POSTGRES_DB: ${DB_NAME:-stone_server}
      POSTGRES_USER: ${DB_USER:-stone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - /opt/snoowoo/stone-server/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stone} -d ${DB_NAME:-stone_server}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - stone-server-internal
    restart: unless-stopped

  stone-redis:
    image: redis:7-alpine
    container_name: stone-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - /opt/snoowoo/stone-server/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stone-server-internal
    restart: unless-stopped

networks:
  stone-server-internal:
    driver: bridge
  snoowoo-public:
    external: true
