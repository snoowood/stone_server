# docker-compose.tester.yml
# Local tester deployment. Pulls the prebuilt image from GHCR — no source needed.
# Bound to 127.0.0.1 by default. Set LAN_BIND=0.0.0.0 in .env for LAN sharing.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/snoowood/stone_server:latest}
    pull_policy: always
    env_file: .env
    environment:
      DB_URL: postgres://${DB_USER:-stone}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-stone_server}?sslmode=disable
      REDIS_URL: redis://redis:6379
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stone_server}
      POSTGRES_USER: ${DB_USER:-stone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stone} -d ${DB_NAME:-stone_server}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal
    # Postgres is NOT exposed to the host. Internal-network only.

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal
    # Redis is NOT exposed to the host. Internal-network only.

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${LAN_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${LAN_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_CERT=${SSL_CERT:-/etc/nginx/certs/selfsigned.crt}
      - SSL_KEY=${SSL_KEY:-/etc/nginx/certs/selfsigned.key}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
