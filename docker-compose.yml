services:
  app:
    build: .
    env_file: .env
    environment:
      # Fail-closed: Docker 배포는 기본 production. dev 로그인(/auth/dev)·임의 토큰
      # 발급(/internal/dev-token)·mock Steam 은 APP_ENV != production 일 때만 노출되므로,
      # .env 누락/오타로 development 로 떨어져 계정 탈취 경로가 열리는 것을 막는다.
      # 의도적 staging/dev 컨테이너는 호스트에서 APP_ENV 를 명시 export 해 override.
      APP_ENV: ${APP_ENV:-production}
      DB_URL: postgres://${DB_USER:-stone}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-stone_server}?sslmode=disable
      REDIS_URL: redis://redis:6379
      # .env sets SQLITE_PATH for local (non-Docker) dev; clear it here so the
      # container uses the Postgres+Redis services instead of single-file SQLite.
      SQLITE_PATH: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stone_server}
      POSTGRES_USER: ${DB_USER:-stone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stone} -d ${DB_NAME:-stone_server}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_CERT=${SSL_CERT:-/etc/nginx/certs/selfsigned.crt}
      - SSL_KEY=${SSL_KEY:-/etc/nginx/certs/selfsigned.key}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - internal

  # Runs only in production (docker compose --profile production up -d).
  # Renews Let's Encrypt certificates every 12 hours via the webroot method.
  certbot:
    image: certbot/certbot
    profiles: ["production"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_certs:
  certbot_www:
