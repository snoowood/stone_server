name: Publish tester release

# Mirrors tester-release/ to the separate release repo and bumps APP_IMAGE
# in .env.template to the new tag, so testers can `git pull` to update.
#
# Required repo secrets / variables (set under Settings → Secrets and variables → Actions):
#   - secrets.RELEASE_REPO_TOKEN  : a fine-grained PAT or GitHub App token with
#                                   contents:write on the release repo
#   - vars.RELEASE_REPO_SLUG      : "<owner>/<repo>" of the release repo
#                                   (e.g. "gensdeis/stone-server-tester")

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. v0.1.0 or sha-abc1234)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check out release repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RELEASE_REPO_SLUG }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          path: release

      - name: Sync tester-release/ → release repo
        run: |
          set -eu
          # Wipe everything except .git so deletions in source propagate.
          find release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a src/tester-release/. release/

      - name: Pin image tag in .env.template
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_PATH: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_PATH}:${IMAGE_TAG}|" release/.env.template
          grep '^APP_IMAGE=' release/.env.template

      - name: Commit & push
        working-directory: release
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          git config user.name  "stone-server release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Release ${IMAGE_TAG}"
          git tag "${IMAGE_TAG}"
          git push origin HEAD
          git push origin "${IMAGE_TAG}"
