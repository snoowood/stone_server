name: Publish tester release

# Mirrors tester-release/ from main → the same repo's `deploy` branch as an
# orphan history (no source code). Testers clone with:
#   git clone -b deploy --single-branch <repo-url> stone-server-tester
#
# Uses GITHUB_TOKEN which is automatically scoped to this repo with
# contents:write below — no PAT or secret setup required.

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. v0.1.0 or sha-abc1234)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source (main)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Publish to deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_PATH: ghcr.io/${{ github.repository }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -eu

          # 1. Stage the release content (with the image tag pinned).
          mkdir -p /tmp/payload
          cp -a src/tester-release/. /tmp/payload/
          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_PATH}:${IMAGE_TAG}|" /tmp/payload/.env.template
          grep '^APP_IMAGE=' /tmp/payload/.env.template

          # 2. Get a clean clone of this repo to operate the deploy branch in.
          git clone "$REPO_URL" /tmp/deploy-clone
          cd /tmp/deploy-clone

          # 3. Check out (or create) the deploy branch as an orphan — no main history.
          if git ls-remote --exit-code --heads origin deploy >/dev/null 2>&1; then
            git fetch origin deploy
            git checkout -B deploy origin/deploy
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          else
            echo "deploy branch does not exist yet — creating orphan."
            git checkout --orphan deploy
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi

          # 4. Drop the payload in.
          cp -a /tmp/payload/. .

          # 5. Commit & push if anything changed.
          git config user.name  "stone-server release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Release ${IMAGE_TAG}"
          git push origin deploy
          # Note: we don't tag the deploy branch here. The image_tag (e.g.
          # v0.1.0) already exists as a tag on main; the commit message above
          # is enough to trace which deploy commit ships which image.
